name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里没有 gradle wrapper，直接用 setup-gradle 指定版本，省掉提交 wrapper jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify module payload
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          echo "== APK =="; ls -l "$APK"
          echo "== META-INF/xposed 必须存在，否则 LSPosed 认不出模块 =="
          unzip -l "$APK" | grep -E 'META-INF/xposed/(java_init.list|module.prop|scope.list)'
          mkdir -p out
          cp "$APK" out/scenehook.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenehook-apk
          path: out/scenehook.apk

      # 打 tag 时发对应版本；普通 push 时维护一个 latest 版本，方便直接下载
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'SceneHook latest' }}
          body: |
            自动构建产物。

            **安装**：下载 `scenehook.apk` → 安装 → LSPosed 里启用模块并勾选 `com.omarea.vtools` → 强行停止 Scene 再打开。

            **验证**：`logcat -s SceneHook:V` 应看到 `SceneHook 安装完成: 5/5 个 hook 生效`。

            **配置**：`/sdcard/Download/scenehook/config.json`
            ```json
            { "enabled": true, "mode": "trial", "expiry": "2099-12-31", "debug": false }
            ```
          files: out/scenehook.apk
          fail_on_unmatched_files: true
